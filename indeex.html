<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimalist Study Deck & Field Log</title>
  <style>
    /* ========================================================
       1. COLOR PALETTE & GLOBAL STYLES (Nature / Earth Tones)
       ======================================================== */
    :root {
      --bg-base: #f4f6f0;          /* Warm oat/linen */
      --card-bg: #ffffff;          /* Clean white */
      --text-main: #243324;        /* Deep pine/forest slate */
      --text-muted: #5e6d5e;       /* Muted moss */
      --accent-green: #3d6a45;     /* Deep foliage green */
      --accent-hover: #2e5134;     /* Dark evergreen */
      --border-line: #dcdfd5;      /* Subtle pebble gray */
      --danger-color: #a84242;     /* Earthy terracotta red */
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* ========================================================
       2. HEADER
       ======================================================== */
    header {
      text-align: center;
      margin-bottom: 32px;
    }

    .tagline {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent-green);
      font-weight: 700;
      margin-bottom: 6px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    /* ========================================================
       3. RESPONSIVE GRID LAYOUT
       ======================================================== */
    .dashboard-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 1120px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-line);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-line);
    }

    .card-top h2 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .chip {
      font-size: 0.75rem;
      background: var(--bg-base);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
      border: 1px solid var(--border-line);
    }

    /* ========================================================
       4. INTERACTIVE 3D FLASHCARD
       ======================================================== */
    .flashcard-wrapper {
      perspective: 1000px;
      margin-bottom: 16px;
      cursor: pointer;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 200px;
      text-align: center;
      transition: transform 0.5s ease;
      transform-style: preserve-3d;
    }

    .flashcard-wrapper.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }

    .flashcard-side {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid var(--border-line);
    }

    .flashcard-front {
      background: #fafbfa;
      color: var(--text-main);
    }

    .flashcard-back {
      background: #eef2eb;
      color: var(--accent-green);
      transform: rotateY(180deg);
      border-color: #ccd5c6;
    }

    .card-category {
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .card-text {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.45;
    }

    /* ========================================================
       5. INPUTS & BUTTONS
       ======================================================== */
    .button-group {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    button {
      background-color: var(--accent-green);
      color: #ffffff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button.btn-light {
      background-color: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-line);
    }

    button.btn-light:hover {
      background-color: var(--bg-base);
    }

    input {
      border: 1px solid var(--border-line);
      background-color: #fafbfa;
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 6px;
      outline: none;
      font-size: 0.9rem;
    }

    input:focus {
      border-color: var(--accent-green);
      background-color: #ffffff;
    }

    /* ========================================================
       6. FOCUS TIMER
       ======================================================== */
    .timer-display {
      font-size: 3.8rem;
      font-weight: 700;
      text-align: center;
      margin: 18px 0;
      font-variant-numeric: tabular-nums;
      color: var(--text-main);
    }

    .mode-chips {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
    }

    .mode-chips button {
      font-size: 0.75rem;
      padding: 6px 12px;
      border-radius: 20px;
    }

    /* ========================================================
       7. LOG & TRACKER
       ======================================================== */
    .tracker-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .expense-list {
      list-style: none;
      max-height: 140px;
      overflow-y: auto;
      margin-bottom: 14px;
    }

    .expense-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 6px;
      border-bottom: 1px solid var(--border-line);
      font-size: 0.88rem;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 2px 6px;
      margin-left: 8px;
    }

    .delete-btn:hover {
      color: var(--danger-color);
      background: transparent;
    }

    .total-row {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 2px solid var(--border-line);
      font-weight: 700;
      font-size: 1.05rem;
    }

    .total-value {
      color: var(--accent-green);
    }
  </style>
</head>
<body>

  <header>
    <div class="tagline">Aviation & Field Notebook</div>
    <h1>Study & Log Deck</h1>
  </header>

  <main class="dashboard-container">

    <!-- MODULE 1: AVIATION & NATURE FLASHCARDS -->
    <section class="card">
      <div class="card-top">
        <h2>Flashcards</h2>
        <span class="chip" id="cardCounter">1 / 6</span>
      </div>

      <div class="flashcard-wrapper" id="cardWrapper" onclick="toggleCardFlip()">
        <div class="flashcard-inner">
          <div class="flashcard-side flashcard-front">
            <span class="card-category" id="frontCategory">Category</span>
            <div class="card-text" id="frontText">Loading question...</div>
          </div>
          <div class="flashcard-side flashcard-back">
            <span class="card-category">Answer</span>
            <div class="card-text" id="backText">Loading answer...</div>
          </div>
        </div>
      </div>

      <div class="button-group">
        <button class="btn-light" onclick="prevCard()">Previous</button>
        <button onclick="nextCard()">Next Card</button>
      </div>
    </section>

    <!-- MODULE 2: STUDY TIMER -->
    <section class="card">
      <div class="card-top">
        <h2>Study Timer</h2>
        <span class="chip" id="timerStateLabel">Standby</span>
      </div>

      <div class="timer-display" id="timerDisplay">25:00</div>

      <div class="button-group">
        <button id="toggleTimerBtn" onclick="toggleTimer()">Start</button>
        <button class="btn-light" onclick="resetTimer()">Reset</button>
      </div>

      <div class="mode-chips">
        <button class="btn-light" onclick="setTimerDuration(25, 'Study Session')">25m Study</button>
        <button class="btn-light" onclick="setTimerDuration(5, 'Short Break')">5m Break</button>
        <button class="btn-light" onclick="setTimerDuration(15, 'Long Break')">15m Break</button>
      </div>
    </section>

    <!-- MODULE 3: GEAR & LOG TRACKER -->
    <section class="card">
      <div class="card-top">
        <h2>Field & Flight Log</h2>
        <span class="chip">Active Total</span>
      </div>

      <form class="tracker-form" onsubmit="addEntry(event)">
        <input type="text" id="entryName" placeholder="Item or gear name..." required />
        <input type="number" id="entryAmount" placeholder="Amount / Cost ($)" step="0.01" required />
        <button type="submit">Log Entry</button>
      </form>

      <ul class="expense-list" id="entryList"></ul>

      <div class="total-row">
        <span>Total:</span>
        <span class="total-value" id="totalValue">$0.00</span>
      </div>
    </section>

  </main>

  <script>
    /* ========================================================
       1. SYNTHESIZED SOUND GENERATOR (Web Audio API)
       ======================================================== */
    function playChime(frequency = 520, duration = 0.25) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(frequency, ctx.currentTime);

        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (err) {
        // Audio will quietly fail if user interactions are blocked
      }
    }

    /* ========================================================
       2. FLASHCARD LOGIC & CURATED QUESTION DECK
       ======================================================== */
    const flashcards = [
      {
        category: "Aviation PPL • Aerodynamics",
        q: "What are the four primary flight controls on an airplane and their functions?",
        a: "Ailerons (roll), Elevator (pitch), Rudder (yaw), and Throttle (thrust/power)."
      },
      {
        category: "Aviation PPL • Airspace",
        q: "What are the standard VFR day minimums for Class G airspace below 1,200 ft AGL?",
        a: "1 statute mile visibility and clear of clouds."
      },
      {
        category: "Aviation PPL • Regulations",
        q: "What minimum fuel reserve is required by FAR 91.151 for VFR day flights?",
        a: "Enough fuel to reach the destination plus an additional 30 minutes at normal cruising speed."
      },
      {
        category: "Wildlife & Ecology",
        q: "What is the biological term for birds shedding and replacing worn feathers?",
        a: "Molting (essential for maintaining aerodynamic efficiency and thermoregulation)."
      },
      {
        category: "Aviation PPL • Instruments",
        q: "Which three flight instruments operate using the pitot-static system?",
        a: "The Airspeed Indicator, Altimeter, and Vertical Speed Indicator (VSI)."
      },
      {
        category: "Wildlife & Ecology",
        q: "How do raptors like hawks and eagles stay aloft for hours without flapping?",
        a: "They circle within rising columns of warm air called thermals to gain altitude."
      }
    ];

    let currentIndex = 0;
    const cardWrapper = document.getElementById("cardWrapper");
    const frontCategory = document.getElementById("frontCategory");
    const frontText = document.getElementById("frontText");
    const backText = document.getElementById("backText");
    const cardCounter = document.getElementById("cardCounter");

    function renderCard() {
      cardWrapper.classList.remove("flipped");
      setTimeout(() => {
        const card = flashcards[currentIndex];
        frontCategory.textContent = card.category;
        frontText.textContent = card.q;
        backText.textContent = card.a;
        cardCounter.textContent = `${currentIndex + 1} / ${flashcards.length}`;
      }, 150);
    }

    function toggleCardFlip() {
      cardWrapper.classList.toggle("flipped");
      playChime(480, 0.1);
    }

    function nextCard() {
      currentIndex = (currentIndex + 1) % flashcards.length;
      renderCard();
    }

    function prevCard() {
      currentIndex = (currentIndex - 1 + flashcards.length) % flashcards.length;
      renderCard();
    }

    // Initialize first card
    renderCard();

    /* ========================================================
       3. TIMER LOGIC
       ======================================================== */
    let timerDuration = 25 * 60;
    let timerRemaining = timerDuration;
    let timerHandle = null;

    const timerDisplay = document.getElementById("timerDisplay");
    const toggleTimerBtn = document.getElementById("toggleTimerBtn");
    const timerStateLabel = document.getElementById("timerStateLabel");

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }

    function toggleTimer() {
      if (timerHandle) {
        // Pause
        clearInterval(timerHandle);
        timerHandle = null;
        toggleTimerBtn.textContent = "Resume";
        timerStateLabel.textContent = "Paused";
      } else {
        // Start
        toggleTimerBtn.textContent = "Pause";
        timerStateLabel.textContent = "Running";
        playChime(600, 0.15);

        timerHandle = setInterval(() => {
          if (timerRemaining > 0) {
            timerRemaining--;
            timerDisplay.textContent = formatTime(timerRemaining);
          } else {
            clearInterval(timerHandle);
            timerHandle = null;
            toggleTimerBtn.textContent = "Start";
            timerStateLabel.textContent = "Finished";
            // Soft two-tone alert
            playChime(520, 0.25);
            setTimeout(() => playChime(660, 0.35), 200);
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerHandle);
      timerHandle = null;
      timerRemaining = timerDuration;
      toggleTimerBtn.textContent = "Start";
      timerStateLabel.textContent = "Standby";
      timerDisplay.textContent = formatTime(timerRemaining);
    }

    function setTimerDuration(minutes, label) {
      timerDuration = minutes * 60;
      timerStateLabel.textContent = label;
      resetTimer();
    }

    /* ========================================================
       4. EXPENSE & FIELD LOG TRACKER
       ======================================================== */
    let logEntries = [];
    const entryList = document.getElementById("entryList");
    const totalValue = document.getElementById("totalValue");

    function renderLog() {
      entryList.innerHTML = "";
      let sum = 0;

      logEntries.forEach((entry, index) => {
        sum += entry.amount;
        const li = document.createElement("li");
        li.innerHTML = `
          <span>${entry.name}</span>
          <div>
            <strong>$${entry.amount.toFixed(2)}</strong>
            <button class="delete-btn" onclick="removeEntry(${index})" title="Delete">✕</button>
          </div>
        `;
        entryList.appendChild(li);
      });

      totalValue.textContent = `$${sum.toFixed(2)}`;
    }

    function addEntry(e) {
      e.preventDefault();
      const nameInput = document.getElementById("entryName");
      const amountInput = document.getElementById("entryAmount");

      const name = nameInput.value.trim();
      const amount = parseFloat(amountInput.value);

      if (!name || isNaN(amount) || amount <= 0) return;

      logEntries.push({ name, amount });
      playChime(700, 0.08);
      renderLog();

      nameInput.value = "";
      amountInput.value = "";
      nameInput.focus();
    }

    function removeEntry(index) {
      logEntries.splice(index, 1);
      renderLog();
    }
  </script>
</body>
</html>
